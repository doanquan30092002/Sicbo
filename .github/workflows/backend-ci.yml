name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: sicbo
          POSTGRES_PASSWORD: sicbo
          POSTGRES_DB: sicbo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sicbo:sicbo@localhost:5432/sicbo_test
      JWT_SECRET_KEY: ci_secret_ci_secret_ci_secret_ci_secret_ci_secret_ci_secret_aaaa
      JWT_REFRESH_SECRET_KEY: ci_refresh_ci_refresh_ci_refresh_ci_refresh_ci_refresh_bbbb
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short
